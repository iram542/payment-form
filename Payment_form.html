 <!DOCTYPE html>
 <html lang="en">

 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment_form</title>
    <link rel="stylesheet" href="style.css">
 </head>

 <body>
    <form action="">
      <h1>Payment form</h1>
      <h2>Contact information</h2>
      <p>Name: *<input type="text" name="name" required></p>
      <fieldset>
    <legend>Gender*</legend>
      <p>
        Male <input type="radio" name="gender" id="Male"> Female <input type="radio" name="gender" id="Female">
      </p>
      </fieldset>
      <p>Address: <textarea name="Address" id="Address" cols="100" rows="8"></textarea></p>
      <p>Email: *<input type="email"  name="email" id="email" ></p>
      <p>Pincode:* <input type="number" name="pincode" id="pincode"></p>
      <h2>Payment information</h2>
      <P>Card type:
        <select name="card_type" id="card_type" required>
        <option value="" >--Select a Card  Type--</option>
        <option value="visa">visa</option>
         <option value="rast">rast</option>
          <option value="cash">cash</option>
        </select>
      </P> 
      <p>Card Number *<input type="number" name="card_number" id="card_number" required>
        <p>Expiry Date: <input type="date" name="exp_date" id="exp_date"></p>
        <P>CVV <input type="password" name="cvv" id="cvv"></P>
            <input type="submit" value="Pay Now">
    

    </form>
 </body>
 </html>
